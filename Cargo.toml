[workspace]
members = ["crates/*", "src-tauri"]
exclude = ["crates/audio"]
resolver = "2"

# Release build optimizations for smaller binary and faster runtime
[profile.release]
lto = "thin"           # Thin LTO: good size reduction, reasonable compile time
codegen-units = 1      # Single codegen unit for better optimization
panic = "abort"        # No unwind tables - smaller binary
strip = "symbols"      # Strip debug symbols
opt-level = 3          # Maximum optimization

# Keep dev builds responsive while running dependency-heavy audio decode paths
# at optimized speed (cargo tauri dev waveform generation path).
[profile.dev.package.audio-engine]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.symphonia-utils-xiph]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-adpcm]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
