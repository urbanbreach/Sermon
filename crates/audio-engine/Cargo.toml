[package]
name = "audio-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
wasapi = "0.22"
tracing = "0.1"
ulid = "1"
thiserror = "2"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# DSD format support
dsf = "0.2"
dff-meta = "0.1"

# Lock-free ring buffer for ASIO callback thread safety
ringbuf = "0.4"

# High-quality sample rate conversion
rubato = "0.16"

[target.'cfg(windows)'.dependencies]
asio-sys = "0.2.5"
windows-sys = { version = "0.59", features = ["Win32_System_Com"] }

[dev-dependencies]
tempfile = "3"
