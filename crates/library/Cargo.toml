[package]
name = "library"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
blake3 = "1"
tracing = "0.1"
globset = "0.4"
tags = { path = "../tags" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
